name: booking-personal-trainer

services:
  api:
    container_name: booking-pt-api
    build: .
    volumes:
    - .:/usr/src/app
    - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  postgres:
    container_name: booking-pt-postgres
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 
