name: booking-personal-trainer-dev

services:
  api:
    container_name: booking-pt-api-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: pnpm start:dev
    volumes:
    - .:/usr/src/app
    - /usr/src/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - .docker.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  postgres:
    container_name: booking-pt-postgres
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .docker.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    container_name: booking-pt-redis-dev
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: 
